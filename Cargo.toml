[package]
name = "playdoom"
version = "0.9.0"
authors = ["Kyle Coffey <kyle@kylecoffey.com>"]
edition = "2021"

[dependencies]
clap = { version = "4.5.54", features = ["cargo", "derive"] }
itertools = "0.14.0"
dirs = "6.0.0"
once_cell = "1.21.3"
walkdir = "2.5.0"
serde = { version = "1.0.228", features = ["derive"] }
ctrlc = "3.5.1"
dialoguer = "0.12.0"
indoc = "2.0.7"
thiserror = "2.0.17"
pretty_env_logger = "0.5.0"
log = "0.4.29"
indicatif = "0.18.3"
ron = "0.12.0"
normpath = "1.5.0"
shlex = "1.3.0"
